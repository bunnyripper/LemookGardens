{% if popup %}
<div id="announcement-popup" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;">
    <div style="max-width: 500px; width: 90%; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative;">
        
        <!-- Close button -->
        <button onclick="document.getElementById('announcement-popup').style.display='none'" 
                style="position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #fff; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">
            &times;
        </button>
        
        <!-- Image -->
        {% if popup.image %}
        <img src="{{ url_for('static', filename='uploads/' + popup.image) }}" 
             alt="{{ popup.title }}" style="width: 100%; height: 250px; object-fit: cover;">
        {% else %}
        <div style="width: 100%; height: 200px; background: #1E3A2B; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px;">
            📢 Announcement
        </div>
        {% endif %}
        
        <!-- Content -->
        <div style="padding: 24px 28px 28px;">
            <h3 style="margin: 0 0 8px; font-family: 'Fraunces', serif; color: #1E3A2B;">{{ popup.title }}</h3>
            <p style="margin: 0 0 16px; color: #5C6155; line-height: 1.6;">{{ popup.content }}</p>
            <a href="{{ url_for('main.announcement_detail', id=popup.id) }}" 
               style="display: inline-block; background: #B8863E; color: #fff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">
                Learn More →
            </a>
        </div>
    </div>
</div>

<script>
    // Show pop-up after 2 seconds
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            document.getElementById('announcement-popup').style.display = 'flex';
        }, 2000);
    });
</script>
{% endif %}
