{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <a href="{{ url_for('main.index') }}" style="color: #B8863E; text-decoration: none;">← Back</a>
    
    {% if announcement.image %}
    <img src="{{ url_for('static', filename='uploads/' + announcement.image) }}" 
         alt="{{ announcement.title }}" style="width: 100%; height: 300px; object-fit: cover; border-radius: 12px; margin: 20px 0;">
    {% endif %}
    
    <h1 style="font-family: 'Fraunces', serif; color: #1E3A2B;">{{ announcement.title }}</h1>
    <p style="color: #5C6155; line-height: 1.8; font-size: 1.1rem;">{{ announcement.content }}</p>
    <p style="color: #9B9F95; font-size: 0.9rem; margin-top: 20px;">
        Published: {{ announcement.created_at.strftime('%d %b %Y') }}
    </p>
</div>
{% endblock %}
